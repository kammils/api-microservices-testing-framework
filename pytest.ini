[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    --html=reports/report.html
    --self-contained-html

# Test markers
markers =
    integration: Integration tests that test API endpoints
    unit: Unit tests for utilities and helpers
    e2e: End-to-end workflow tests
    slow: Tests that take longer to execute
    asyncio: Async tests using asyncio

# Async configuration
asyncio_mode = auto

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Test discovery
norecursedirs = .git .tox dist build *.egg venv

# Warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
